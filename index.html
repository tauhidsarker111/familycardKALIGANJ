        const base = cleanFirebaseUrl(urlOverride !== null ? urlOverride : getActiveDbUrl());
        if (!base) return '';

        const base = buildDefaultState();
        if (!raw || typeof raw !== 'object') return base;
        const entriesMap = (raw.entriesByDate && typeof raw.entriesByDate === 'object')

      function toBnDigits(str) {
        return String(str).replace(/\d/g, d => BN_DIGITS[Number(d)]);
      }

      function fmtNum(n) { return (Number(n) || 0).toLocaleString('en-IN'); }
      function fmtPct(p) { return `${(Number(p) || 0).toFixed(2)}%`; }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')

          if (isNaN(d.getTime())) return '—';
          let h = d.getHours();

      function getCommittedEntry(enumId, dateStr = selectedDate) {

          const today = getCommittedEntry(en.id, dateStr);

            sl: idx + 1,

            prevTotal,
            today,
            total
          };
        });

        const supStats = state.supervisors.map((sup, idx) => {
          const union = unionMap.get(sup.unionId);
          const enums = enumStats.filter(e => e.supervisorId === sup.id);
          const today = enums.reduce((a, b) => a + b.today, 0);
          const total = enums.reduce((a, b) => a + b.total, 0);
          const zeroToday = enums.filter(e => e.today === 0).length;
          const targetHH = Math.max(0, Number(sup.targetHH) || 0);
          const remaining = Math.max(0, targetHH - total);
          const progressPct = targetHH > 0 ? (total / targetHH) * 100 : 0;
          return {
            sl: idx + 1,
            ...sup,
            unionName: union ? union.name : 'অনির্ধারিত',
            enumCount: enums.length,
            zeroToday,
            today,
            total,
            targetHH,
            remaining,
            progressPct,
            enumerators: enums
          };
        });

        const supRanked = [...supStats].sort((a, b) => b.progressPct - a.progressPct || b.total - a.total);
        supRanked.forEach((s, i) => {
          s.rank = (i > 0 && Math.abs(s.progressPct - supRanked[i - 1].progressPct) < 0.0001 && s.total === supRanked[i - 1].total)
            ? supRanked[i - 1].rank : i + 1;
        });

        const unionStats = state.unions.map((u, idx) => {
          const sups = supStats.filter(s => s.unionId === u.id);
          const enums = enumStats.filter(e => e.unionId === u.id);
          const totalHH = sups.length > 0 ? sups.reduce((a, b) => a + b.targetHH, 0) : (Number(u.totalHH) || 0);
          const today = enums.reduce((a, b) => a + b.today, 0);
          const total = enums.reduce((a, b) => a + b.total, 0);
          const remaining = Math.max(0, totalHH - total);
          const progressPct = totalHH > 0 ? (total / totalHH) * 100 : 0;
          const supCodes = sups.length > 1
            ? `${sups[0].code} – ${sups[sups.length - 1].code}`
            : (sups[0] ? sups[0].code : '—');
          return {
            sl: idx + 1,
            ...u,
            totalHH,
            supCount: sups.length,
            enumCount: enums.length,
            supCodes,
            today,
            total,
            remaining,
            progressPct
          };
        });

        const unionRanked = [...unionStats].sort((a, b) => b.progressPct - a.progressPct || b.total - a.total);
        unionRanked.forEach((u, i) => {
          u.rank = (i > 0 && Math.abs(u.progressPct - unionRanked[i - 1].progressPct) < 0.0001 && u.total === unionRanked[i - 1].total)
            ? unionRanked[i - 1].rank : i + 1;
        });

        const totalPopulation = unionStats.reduce((a, b) => a + (Number(b.population) || 0), 0);
        const totalHH = unionStats.reduce((a, b) => a + b.totalHH, 0);
        const totalCollected = enumStats.reduce((a, b) => a + b.total, 0);
        const totalToday = enumStats.reduce((a, b) => a + b.today, 0);
        const totalRemaining = Math.max(0, totalHH - totalCollected);
        const overallPct = totalHH > 0 ? (totalCollected / totalHH) * 100 : 0;
        const activeTodayCount = enumStats.filter(e => e.today > 0).length;
        const zeroTodayCount = enumStats.length - activeTodayCount;
        const avgPerEnum = enumStats.length > 0 ? (totalToday / enumStats.length) : 0;
        const avgPerActive = activeTodayCount > 0 ? (totalToday / activeTodayCount) : 0;

        const top5 = [...enumStats].sort((a, b) => b.total - a.total || b.today - a.today || a.sl - b.sl).slice(0, 5);
        const bottom5 = [...enumStats].sort((a, b) => a.total - b.total || a.today - b.today || a.sl - b.sl).slice(0, 5);

        return {
          enumStats, supStats, unionStats, unionRanked,
          savedDates: getSavedDatesList(),
          totals: {
            unionCount: unionStats.length,
            supCount: supStats.length,
            enumCount: enumStats.length,
            totalPopulation, totalHH, totalCollected, totalToday, totalRemaining,
            overallPct, activeTodayCount, zeroTodayCount, avgPerEnum, avgPerActive
          },
          top5, bottom5
        };
      }

      function applyRemoteState(remoteData, notifyIfChanged = false) {
        if (!remoteData || typeof remoteData !== 'object' || !Array.isArray(remoteData.enumerators)) return false;
        const prevUpdated = state.updatedAt;
        const isFromOtherClient = !remoteData.clientSyncId || remoteData.clientSyncId !== SESSION_CLIENT_ID;
        state = normalizeState(remoteData);
        saveLocalCache();
        renderApp();
        if (notifyIfChanged && isFromOtherClient && prevUpdated && state.updatedAt !== prevUpdated) {
          showToast('লাইভ অনলাইন ডেটাবেস থেকে নতুন আপডেট এসেছে!', 'info');
        }
        return true;
      }

      // Fetch latest JSON from Firebase Realtime Database
      async function pullFromFirebase(silent = false) {
        const endpoint = getFirebaseEndpoint();
        if (!endpoint) {
          setSyncStatus('local');
          if (!silent) showToast('কোনো Firebase URL যুক্ত করা নেই। অ্যাডমিন ট্যাব ৫ থেকে সংযুক্ত করুন।', 'info');
          return false;
        }
        if (!silent) setSyncStatus('syncing');
        try {
          const res = await fetch(endpoint, { method: 'GET', cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data && typeof data === 'object' && Array.isArray(data.enumerators)) {
            applyRemoteState(data, silent);
          }
          setSyncStatus('live', 'সর্বশেষ সিঙ্ক সম্পন্ন');
          if (!silent) showToast('অনলাইন ডেটাবেস থেকে সর্বশেষ ডেটা সিঙ্ক হয়েছে!', 'success');
          return true;
        } catch (err) {
          const isPerm = String(err.message).includes('401') || String(err.message).includes('403');
          const msg = isPerm
            ? 'Firebase Rules ব্লক করেছে (401/403)। Rules-এ ".read": true দিন।'
            : `সংযোগ ত্রুটি (${err.message})`;
          setSyncStatus('error', msg);
          if (!silent) showToast(msg, 'error');
          return false;
        }
      }

      // Push full state JSON via PUT to Firebase Realtime Database
      async function pushToFirebase(silent = false, urlOverride = null) {
        const endpoint = getFirebaseEndpoint(urlOverride);
        if (!endpoint) return false;
        setSyncStatus('syncing');
        const payload = {
          ...state,
          updatedAt: state.updatedAt || new Date().toISOString(),
          updatedBy: 'Admin',
          clientSyncId: SESSION_CLIENT_ID
        };
        try {
          const res = await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          setSyncStatus('live', 'অনলাইন ডেটাবেসে সেভ হয়েছে');
          return true;
        } catch (err) {
          const isPerm = String(err.message).includes('401') || String(err.message).includes('403');
          const msg = isPerm
            ? 'Firebase Rules রাইট ব্লক করেছে (401/403)! Firebase Console → Rules-এ ".write": true করে Publish করুন।'
            : `Firebase সেভ ত্রুটি (${err.message})`;
          setSyncStatus('error', msg);
          if (!silent) showToast(msg, 'error');
          return false;
        }
      }

      // Start native EventSource stream + 15-second fallback polling on error
      function startFallbackPolling() {
        if (fallbackPollTimer) return;
        fallbackPollTimer = setInterval(() => {
          if (getFirebaseEndpoint() && Object.keys(pendingChanges).length === 0 && !document.hidden) {
            pullFromFirebase(true);
          }
        }, 15000);
      }

      function startRealtimeFirebaseStream() {
        stopRealtimeListeners();
        const endpoint = getFirebaseEndpoint();
        if (!endpoint) {
          setSyncStatus('local');
          return;
        }

        if (typeof EventSource === 'undefined') {
          startFallbackPolling();
          return;
        }

        try {
          const es = new EventSource(endpoint);
          fbEventSource = es;

          es.addEventListener('open', () => {
            sseReconnectDelay = 3000;
            setSyncStatus('live', 'রিয়েল-টাইম স্ট্রিম সক্রিয়');
            // Stop fallback poll when SSE stream is healthy
            if (fallbackPollTimer) { clearInterval(fallbackPollTimer); fallbackPollTimer = null; }
          });

          es.addEventListener('put', (ev) => {
            try {
              const packet = JSON.parse(ev.data);
              setSyncStatus('live', 'রিয়েল-টাইম স্ট্রিম সক্রিয়');
              if (!packet) return;
              if (packet.path === '/') {
                const isUpdate = sseReceivedInitial;
                sseReceivedInitial = true;
                if (packet.data && typeof packet.data === 'object' && Object.keys(pendingChanges).length === 0) {
                  applyRemoteState(packet.data, isUpdate);
                }
              } else if (Object.keys(pendingChanges).length === 0) {
                pullFromFirebase(true);
              }
            } catch (_) {}
          });

          es.addEventListener('patch', () => {
            setSyncStatus('live', 'রিয়েল-টাইম স্ট্রিম সক্রিয়');
            if (Object.keys(pendingChanges).length === 0) pullFromFirebase(true);
          });

          es.onerror = () => {
            if (fbEventSource !== es) return;
            try { es.close(); } catch (_) {}
            fbEventSource = null;
            // Activate 15-second fallback polling immediately while reconnecting SSE
            startFallbackPolling();
            if (sseReconnectTimer) clearTimeout(sseReconnectTimer);
            const waitMs = sseReconnectDelay;
            sseReconnectDelay = Math.min(20000, Math.round(sseReconnectDelay * 1.5));
            sseReconnectTimer = setTimeout(() => {
              if (getFirebaseEndpoint()) startRealtimeFirebaseStream();
            }, waitMs);
          };
        } catch (_) {
          startFallbackPolling();
        }
      }

      async function bootRealtimeSync() {
        const endpoint = getFirebaseEndpoint();
        if (!endpoint) {
          setSyncStatus('local');
          renderApp();
          return;
        }
        isInitialFetching = true;
        setSyncStatus('connecting');
        renderApp();

        await pullFromFirebase(true);
        isInitialFetching = false;
        renderApp();
        startRealtimeFirebaseStream();
      }

      // =======================================================================
      // 7. ONE-CLICK GITHUB PAGES READY index.html EXPORTER
      // =======================================================================
      function downloadGitHubReadyHtml() {
        if (!requireAdmin()) return;
        const dbUrl = getActiveDbUrl();
        if (!dbUrl) {
          showToast('প্রথমে নিচে আপনার Firebase Realtime Database URL দিয়ে কানেকশন টেস্ট ও সংযুক্ত করুন!', 'error');
          return;
        }
        try {
          const clone = document.documentElement.cloneNode(true);

          // Reset transient dynamic DOM containers so exported HTML is completely pristine
          ['#app', '#modal-root', '#toast-root'].forEach(sel => {
            const el = clone.querySelector(sel);
            if (el) el.innerHTML = '';
          });

          // Remove runtime-injected Tailwind style sheets (preserve #app-custom-styles)
          clone.querySelectorAll('head style').forEach(st => {
            if (st.id !== 'app-custom-styles') st.remove();
          });

          let html = '<!DOCTYPE html>\n' + clone.outerHTML;

          // Build markers dynamically so this function never matches itself!
          const startMark = '/' + '*__FB_URL_START__*' + '/';
          const endMark = '/' + '*__FB_URL_END__*' + '/';
          const sIdx = html.indexOf(startMark);
          const eIdx = html.indexOf(endMark);
          if (sIdx === -1 || eIdx === -1 || eIdx < sIdx) {
            throw new Error('Firebase URL marker not found in template.');
          }
          html = html.slice(0, sIdx + startMark.length) + JSON.stringify(dbUrl) + html.slice(eIdx);

          const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          const dlUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = dlUrl;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(dlUrl);

          showToast('GitHub-এর জন্য রেডি index.html ডাউনলোড হয়েছে! সরাসরি GitHub রিপোজিটরিতে আপলোড করুন।', 'success');
        } catch (err) {
          showToast('HTML এক্সপোর্ট ত্রুটি: ' + err.message, 'error');
        }
      }

      function parseExcelDateHeader(val) {
        if (val == null || val === '') return null;
        if (val instanceof Date && !isNaN(val.getTime())) return val.toISOString().slice(0, 10);
        if (typeof val === 'number' && val > 35000 && val < 70000 && typeof XLSX !== 'undefined') {
          const d = XLSX.SSF.parse_date_code(val);
          if (d && d.y && d.m && d.d) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
        }
        const s = String(val).trim();
        const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
        const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
        if (dmy) return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;
        return null;
      }

      function handleExcelImportFile(file) {
        if (!requireAdmin() || !file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
            const supTargetByCode = {};
            const supNameByCode = {};

            if (wb.Sheets['Union_Progress_Report']) {
              const uRows = XLSX.utils.sheet_to_json(wb.Sheets['Union_Progress_Report'], { header: 1, raw: true });
              uRows.forEach(row => {
                if (!Array.isArray(row)) return;
                const cIdx = row.findIndex(c => typeof c === 'string' && /^SUP-\d+/i.test(c.trim()));
                if (cIdx !== -1) {
                  const code = row[cIdx].trim();
                  const nameCand = row.slice(cIdx + 1).find(c => typeof c === 'string' && c.trim().length > 1);
                  const numCand = row.slice(cIdx + 1).find(c => typeof c === 'number' && c >= 100);
                  if (nameCand) supNameByCode[code] = nameCand.trim();
                  if (numCand) supTargetByCode[code] = Math.round(numCand);
                }
              });
            }

            const sheetName = wb.Sheets['Daily_Data_Entry'] ? 'Daily_Data_Entry' : wb.SheetNames[0];
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true });

            let headerIdx = -1;
            for (let i = 0; i < Math.min(12, rows.length); i++) {
              const joined = (rows[i] || []).map(c => String(c || '')).join(' ');
              if (joined.includes('ক্রমিক') || joined.includes('Sup. Code') || joined.includes('সুপারভাইজার কোড')) {
                headerIdx = i;
                break;
              }
            }
            if (headerIdx === -1) {
              showToast('Daily_Data_Entry শিটে সঠিক হেডার সারি পাওয়া যায়নি।', 'error');
              return;
            }

            const headerRow = rows[headerIdx];
            const dateCols = [];
            for (let c = 5; c < headerRow.length; c++) {
              const iso = parseExcelDateHeader(headerRow[c]);
              if (iso) dateCols.push({ col: c, date: iso });
            }

            const importedSupMap = new Map();
            const importedEnums = [];
            const importedEntries = {};
            const activeDateSet = new Set();
            let totalEntriesSum = 0;

            const resolveUnionId = (uName) => {
              const found = state.unions.find(x => x.name === String(uName || '').trim());
              return found ? found.id : state.unions[0].id;
            };

            for (let r = headerIdx + 1; r < rows.length; r++) {
              const row = rows[r];
              if (!row || row.length < 5) continue;
              const slVal = row[0];
              const unionName = String(row[1] || '').trim();
              const supCode = String(row[2] || '').trim();
              const supName = String(row[3] || '').trim();
              const enumName = String(row[4] || '').trim();
              if (!supCode || !enumName || isNaN(Number(slVal))) continue;

              if (!importedSupMap.has(supCode)) {
                const ex = state.supervisors.find(s => s.code === supCode);
                importedSupMap.set(supCode, {
                  id: ex ? ex.id : supCode,
                  code: supCode,
                  unionId: resolveUnionId(unionName),
                  name: supNameByCode[supCode] || supName || ex?.name || supCode,
                  targetHH: supTargetByCode[supCode] ?? ex?.targetHH ?? 3000
                });
              }
              const supObj = importedSupMap.get(supCode);
              const idxNum = importedEnums.length + 1;
              const enumId = state.enumerators[idxNum - 1]?.id || `ENUM-${String(idxNum).padStart(3, '0')}`;
              importedEnums.push({ id: enumId, supervisorId: supObj.id, name: enumName });

              dateCols.forEach(({ col, date }) => {
                const v = parseInt(row[col], 10);
                if (!isNaN(v) && v > 0) {
                  if (!importedEntries[date]) importedEntries[date] = {};
                  importedEntries[date][enumId] = v;
                  activeDateSet.add(date);
                  totalEntriesSum += v;
                }
              });
            }

            if (importedEnums.length === 0) {
              showToast('এক্সেলে কোনো তথ্য সংগ্রহকারীর সারি পাওয়া যায়নি।', 'error');
              return;
            }

            pendingExcelImport = {
              fileName: file.name,
              supervisors: Array.from(importedSupMap.values()),
              enumerators: importedEnums,
              entriesByDate: importedEntries,
              datesFound: Array.from(activeDateSet).sort(),
              totalEntriesSum
            };
            openExcelConfirmModal();
          } catch (err) {
            showToast('এক্সেল পড়তে ত্রুটি: ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      }

          ? (Object.prototype.hasOwnProperty.call(pendingChanges, singleEnumId) ? [singleEnumId] : [])
          : Object.keys(pendingChanges);
        if (!keys.length) return;

        const m = computeMetrics(selectedDate);
        let delta = 0;
        let savedEntriesSum = 0;
        const listItems = keys.map(id => {
          const oldVal = getCommittedEntry(id, selectedDate);
          const newVal = Math.max(0, parseInt(pendingChanges[id], 10) || 0);
          delta += (newVal - oldVal);
          savedEntriesSum += newVal;
          const en = state.enumerators.find(e => e.id === id);
          return { name: en ? en.name : id, oldVal, newVal };
        });

        const newDayTotal = Math.max(0, m.totals.totalToday + delta);
        const newUpazilaTotal = Math.max(0, m.totals.totalCollected + delta);
        const newPct = m.totals.totalHH > 0 ? (newUpazilaTotal / m.totals.totalHH) * 100 : 0;

        const previewHtml = listItems.slice(0, 6).map(item => `
          <div class="flex justify-between text-xs py-1">
            <span class="truncate text-slate-700">${escapeHtml(item.name)}</span>
            <strong class="tabular-nums text-gov-800 ml-2 shrink-0">${item.oldVal} → ${item.newVal}</strong>
          </div>
        `).join('') + (listItems.length > 6 ? `<div class="text-[11px] text-slate-500 pt-1 text-center">... এবং আরও ${listItems.length - 6} জন</div>` : '');

        showModal(`

            </div>
            <div class="p-5 space-y-4">
              <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 space-y-2 text-xs sm:text-sm">
                <div class="flex justify-between"><span class="text-slate-600">তারিখ:</span><strong class="tabular-nums text-slate-900">${selectedDate}</strong></div>
                <div class="flex justify-between"><span class="text-slate-600">আপডেটকৃত তথ্য সংগ্রহকারী:</span><strong class="tabular-nums text-gov-800">${keys.length} জন</strong></div>
                <div class="flex justify-between"><span class="text-slate-600">কনফার্মকৃত এন্ট্রির যোগফল:</span><strong class="tabular-nums text-emerald-700">${fmtNum(savedEntriesSum)} টি</strong></div>
                <div class="flex justify-between"><span class="text-slate-600">${selectedDate} তারিখের নতুন মোট:</span><strong class="tabular-nums text-sky-700">${fmtNum(newDayTotal)} টি</strong></div>
                <div class="flex justify-between border-t border-emerald-200 pt-2">
                  <span class="font-semibold text-slate-700">নতুন সর্বমোট উপজেলা:</span>
                  <strong class="tabular-nums text-gov-900 text-base">${fmtNum(newUpazilaTotal)} (${fmtPct(newPct)})</strong>
                </div>
              </div>
              <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 max-h-36 overflow-y-auto divide-y divide-slate-100">
                ${previewHtml}

              <p class="text-[11px] text-slate-500 flex items-start gap-1.5">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600 shrink-0 mt-0.5"></i>
                <span>অন্যান্য তারিখের কোনো ডেটা মুছবে না। নিশ্চিত করলে লোকাল ও লাইভ Firebase ডেটাবেসে সংরক্ষিত হবে।</span>
              </p>
              <div class="flex justify-end gap-2">
                <button type="button" id="dc-cancel" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">বাতিল</button>
                <button type="button" id="dc-ok" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-gov-700 hover:bg-gov-800 text-white shadow-sm">

                </button>

        document.getElementById('dc-cancel').onclick = closeModal;

      async function commitDailyKeys(keys) {
        if (!requireAdmin() || !keys.length) return;
        if (!state.entriesByDate[selectedDate]) state.entriesByDate[selectedDate] = {};
        keys.forEach(enumId => {
          const val = Math.max(0, parseInt(pendingChanges[enumId], 10) || 0);
          if (val === 0) delete state.entriesByDate[selectedDate][enumId];
          else state.entriesByDate[selectedDate][enumId] = val;
          delete pendingChanges[enumId];
        });
        if (Object.keys(state.entriesByDate[selectedDate]).length === 0) {
          delete state.entriesByDate[selectedDate];
        }
        await commitStateAndSync(`${selectedDate} তারিখের ${keys.length} জনের এন্ট্রি সংরক্ষিত`);
      }

      function generateNextEnumId() {
        let maxN = state.enumerators.length;
        state.enumerators.forEach(e => {
          const match = String(e.id).match(/^ENUM-(\d+)$/);
          if (match) maxN = Math.max(maxN, parseInt(match[1], 10));
        });
        return `ENUM-${String(maxN + 1).padStart(3, '0')}`;
      }

                <label class="flex items-start gap-2 cursor-pointer bg-slate-50 border border-slate-200 rounded-xl p-2.5">
                  <input type="radio" name="ex-mode" value="replace" class="mt-0.5" />
                  <span><strong>সম্পূর্ণ প্রতিস্থাপন (Replace All):</strong> বর্তমান সব ডেটা মুছে এক্সেলের ডেটা দিয়ে প্রতিস্থাপন করবে।</span>
                </label>
              </div>
              <div class="flex justify-end gap-2">
                <button type="button" id="ex-cancel" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">বাতিল</button>
                <button type="button" id="ex-ok" class="px-5 py-2 rounded-xl text-xs font-bold bg-gov-700 hover:bg-gov-800 text-white">OK — ইমপোর্ট ও সেভ করুন</button>
              </div>
            </div>
          </div>
        `);
        document.getElementById('ex-close').onclick = () => { pendingExcelImport = null; closeModal(); };
        document.getElementById('ex-cancel').onclick = () => { pendingExcelImport = null; closeModal(); };
        document.getElementById('ex-ok').onclick = async () => {
          const mode = document.querySelector('input[name="ex-mode"]:checked')?.value || 'merge';
          const imp = pendingExcelImport;
          pendingExcelImport = null;
          closeModal();
          if (!imp) return;

          state.supervisors = imp.supervisors;
          state.enumerators = imp.enumerators;
          if (mode === 'replace') {
            state.entriesByDate = imp.entriesByDate;
          } else {
            for (const d of Object.keys(imp.entriesByDate)) {
              if (!state.entriesByDate[d]) state.entriesByDate[d] = {};
              Object.assign(state.entriesByDate[d], imp.entriesByDate[d]);
            }
          }
          if (imp.datesFound.length > 0) selectedDate = imp.datesFound[imp.datesFound.length - 1];
          pendingChanges = {};
          await commitStateAndSync(`এক্সেল থেকে ${imp.enumerators.length} জন তথ্য সংগ্রহকারীর ডেটা ইমপোর্ট হয়েছে`);
        };
      }

      // =======================================================================
      // 10. TAB SWITCHING & DATE NAVIGATION GUARDS
      // =======================================================================
      function switchTab(targetTab) {
        if (targetTab === activeTab) return;
        const doSwitch = () => {
          if (PROTECTED_TABS.has(targetTab) && !isAdminUnlocked) {
            openAdminLoginModal(targetTab);
            return;
          }
          activeTab = targetTab;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        if (Object.keys(pendingChanges).length > 0) {
          openUnsavedGuardModal(
            () => { pendingChanges = {}; doSwitch(); },
            async () => { await commitDailyKeys(Object.keys(pendingChanges)); doSwitch(); }
          );
          return;
        }
        doSwitch();
      }

      function requestDateChange(newDate) {
        if (!newDate || newDate === selectedDate) return;
        const applyDate = () => {
          selectedDate = newDate;
          pendingChanges = {};
          renderApp();
        };
        if (Object.keys(pendingChanges).length > 0) {
          openUnsavedGuardModal(
            () => { pendingChanges = {}; applyDate(); },
            async () => { await commitDailyKeys(Object.keys(pendingChanges)); applyDate(); }
          );
          return;
        }
        applyDate();
      }

      function lockAdminMode() {
        const doLock = () => {
          isAdminUnlocked = false;
          safeDelSS(SS_ADMIN_KEY);
          if (PROTECTED_TABS.has(activeTab)) activeTab = 'overview';
          renderApp();
          showToast('অ্যাডমিন মোড লক করা হয়েছে (পাবলিক ভিউ চালু)', 'info');
        };
        if (Object.keys(pendingChanges).length > 0) {
          openUnsavedGuardModal(
            () => { pendingChanges = {}; doLock(); },
            async () => { await commitDailyKeys(Object.keys(pendingChanges)); doLock(); }
          );
          return;
        }
        doLock();
      }

                      <th class="py-2.5 px-2 text-center">জরিপকারী</th><th class="py-2.5 px-2 text-center">সুপারভাইজার</th><th class="py-2.5 px-2">কোড</th>
                      <th class="py-2.5 px-2 text-right">আজকের এন্ট্রি</th><th class="py-2.5 px-2 text-right">মোট এন্ট্রি</th><th class="py-2.5 px-2 text-right">বাকি খানা</th>
                      <th class="py-2.5 px-2 w-32">অগ্রগতি (%)</th><th class="py-2.5 px-2 text-center">অবস্থান</th>

                    <tr>
                      <td colspan="5" class="py-3 px-2">সর্বমোট — কালীগঞ্জ উপজেলা (১টি পৌরসভা ও ৭টি ইউনিয়ন)</td>
                      <td class="py-3 px-2 text-right tabular-nums">${fmtNum(t.totalPopulation)}</td>
                      <td class="py-3 px-2 text-right tabular-nums">${fmtNum(t.totalHH)}</td>

                      <td class="py-3 px-2 text-xs">মোট ${t.supCount}</td>
                      <td class="py-3 px-2 text-right tabular-nums text-sky-800">${fmtNum(t.totalToday)}</td>
                      <td class="py-3 px-2 text-right tabular-nums text-emerald-800">${fmtNum(t.totalCollected)}</td>
                      <td class="py-3 px-2 text-right tabular-nums">${fmtNum(t.totalRemaining)}</td>
                      <td class="py-3 px-2 text-right tabular-nums text-gov-800">${fmtPct(t.overallPct)}</td>

            <!-- Table 2: Supervisor Progress Report -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden print-section print-break-before">
              <div class="bg-slate-50 px-5 py-3.5 border-b border-slate-200 flex items-center justify-between">
                <h3 class="text-sm sm:text-base font-bold text-slate-900">সারণি-২: সুপারভাইজার ভিত্তিক দৈনিক অগ্রগতি প্রতিবেদন (Supervisor Progress Report)</h3>
                <span class="text-xs font-semibold text-slate-600 no-print">মোট ${t.supCount} জন সুপারভাইজার</span>
              </div>
              <div class="overflow-x-auto table-scroll">
                <table class="w-full text-left border-collapse text-xs sm:text-sm">
                  <thead class="bg-gov-800 text-white">
                    <tr>
                      <th class="py-2.5 px-2.5 text-center">ক্রমিক</th><th class="py-2.5 px-2.5">ইউনিয়ন / পৌরসভা</th><th class="py-2.5 px-2.5">কোড</th>
                      <th class="py-2.5 px-2.5">সুপারভাইজারের নাম</th><th class="py-2.5 px-2.5 text-right">টার্গেট খানা</th><th class="py-2.5 px-2.5 text-center">জরিপকারী</th>
                      <th class="py-2.5 px-2.5 text-center">আজ ০ এন্ট্রি সতর্কতা</th><th class="py-2.5 px-2.5 text-right">আজকের এন্ট্রি</th>
                      <th class="py-2.5 px-2.5 text-right">মোট এন্ট্রি</th><th class="py-2.5 px-2.5 text-right">বাকি খানা</th>
                      <th class="py-2.5 px-2.5 w-36">অগ্রগতির হার (%)</th><th class="py-2.5 px-2.5 text-center">অবস্থান</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">${supRows}</tbody>
                  <tfoot class="bg-gov-50 font-bold text-slate-900 border-t-2 border-gov-800">
                    <tr>
                      <td colspan="4" class="py-3 px-2.5">সর্বমোট — সকল সুপারভাইজার</td>
                      <td class="py-3 px-2.5 text-right tabular-nums">${fmtNum(t.totalHH)}</td>
                      <td class="py-3 px-2.5 text-center tabular-nums">${t.enumCount}</td>
                      <td class="py-3 px-2.5 text-center tabular-nums text-rose-700">${t.zeroTodayCount}</td>
                      <td class="py-3 px-2.5 text-right tabular-nums text-sky-800">${fmtNum(t.totalToday)}</td>
                      <td class="py-3 px-2.5 text-right tabular-nums text-emerald-800">${fmtNum(t.totalCollected)}</td>
                      <td class="py-3 px-2.5 text-right tabular-nums">${fmtNum(t.totalRemaining)}</td>
                      <td class="py-3 px-2.5 text-right tabular-nums text-gov-800">${fmtPct(t.overallPct)}</td>
                      <td class="py-3 px-2.5 text-center">—</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

            <!-- Table 3: Expandable Supervisor -> Enumerator Report -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden print-section print-break-before">
              <div class="bg-slate-50 px-5 py-3.5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                <h3 class="text-sm sm:text-base font-bold text-slate-900">সারণি-৩: সুপারভাইজার ও তথ্য সংগ্রহকারী বিস্তারিত প্রতিবেদন (Grouped Subtotals)</h3>
                <div class="flex items-center gap-2 no-print">
                  <button type="button" id="rep-expand-all" class="text-xs font-semibold text-gov-800 bg-white border border-slate-200 hover:bg-gov-50 px-2.5 py-1 rounded-lg">সব খুলুন</button>
                  <button type="button" id="rep-collapse-all" class="text-xs font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 px-2.5 py-1 rounded-lg">সব গুটিয়ে নিন</button>
                </div>
              </div>
              <div class="overflow-x-auto table-scroll">
                <table class="w-full text-left border-collapse text-xs sm:text-sm">
                  <thead class="bg-slate-800 text-white">
                    <tr>
                      <th class="py-2.5 px-3 text-center w-12">ক্রমিক</th><th class="py-2.5 px-3">ইউনিয়ন / পৌরসভা</th><th class="py-2.5 px-3">সুপারভাইজার কোড</th>
                      <th class="py-2.5 px-3">তথ্য সংগ্রহকারীর নাম</th><th class="py-2.5 px-3 text-right">আজকের এন্ট্রি</th><th class="py-2.5 px-3 text-right">মোট এন্ট্রি</th>
                      <th class="py-2.5 px-3 text-right">টার্গেট খানা</th><th class="py-2.5 px-3 text-right">বাকি খানা</th><th class="py-2.5 px-3 text-right">অগ্রগতি (%)</th>
                    </tr>
                  </thead>
                  ${groupedBodies}
                </table>
              </div>
            </div>

            <!-- 3 Official Government Signature Blocks -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 print-section">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-10 pt-10 text-center">
                <div class="space-y-1">
                  <div class="border-t border-slate-700 pt-2 mx-4 font-bold text-xs sm:text-sm text-slate-900">প্রস্তুতকারীর স্বাক্ষর ও তারিখ</div>
                  <p class="text-[11px] text-slate-500">তথ্য ও ডেটা এন্ট্রি অপারেটর</p>
                </div>
                <div class="space-y-1">
                  <div class="border-t border-slate-700 pt-2 mx-4 font-bold text-xs sm:text-sm text-slate-900">সমন্বয়কারী কর্মকর্তা / পরিসংখ্যান অফিসার</div>
                  <p class="text-[11px] text-slate-500">কালীগঞ্জ, গাজীপুর</p>
                </div>
                <div class="space-y-1">
                  <div class="border-t border-slate-700 pt-2 mx-4 font-bold text-xs sm:text-sm text-slate-900">উপজেলা নির্বাহী অফিসার</div>
                  <p class="text-[11px] text-slate-500">কালীগঞ্জ, গাজীপুর</p>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      // --- TAB 3: ADMIN DAILY DATA ENTRY ---
      function buildDailyHtml(m) {
        const unionOpts = `<option value="">সকল ইউনিয়ন/পৌরসভা</option>` +
          state.unions.map(u => `<option value="${u.id}" ${dailyFilters.unionId === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`).join('');

        const availSups = dailyFilters.unionId ? state.supervisors.filter(s => s.unionId === dailyFilters.unionId) : state.supervisors;
        if (dailyFilters.supervisorId && !availSups.some(s => s.id === dailyFilters.supervisorId)) dailyFilters.supervisorId = '';
        const supOpts = `<option value="">সকল সুপারভাইজার</option>` +
          availSups.map(s => `<option value="${s.id}" ${dailyFilters.supervisorId === s.id ? 'selected' : ''}>${escapeHtml(s.code)} — ${escapeHtml(s.name)}</option>`).join('');

        const savedChips = m.savedDates.length === 0
          ? `<span class="text-xs text-slate-500">এখনো কোনো তারিখের এন্ট্রি সংরক্ষিত হয়নি। নিচে সংখ্যা লিখে <strong>OK</strong> কনফার্ম করলে এখানে তারিখ যুক্ত হবে।</span>`
          : m.savedDates.map(item => {
              const cur = item.date === selectedDate;
              return `
                <button type="button" data-saved-date="${item.date}"
                        class="inline-flex items-center gap-1.5 border rounded-lg px-2.5 py-1 text-xs font-semibold tabular-nums transition ${cur ? 'bg-gov-800 text-white border-gov-900 shadow-xs' : 'bg-white hover:bg-emerald-100 text-slate-800 border-emerald-200'}">
                  <i data-lucide="calendar-check" class="w-3.5 h-3.5 ${cur ? 'text-amber-300' : 'text-gov-600'}"></i>
                  <span>${item.date}</span>
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${cur ? 'bg-white/20 text-white' : 'bg-emerald-50 text-gov-800'}">${fmtNum(item.total)} এন্ট্রি · ${item.activeCount} সক্রিয়</span>
                </button>`;
            }).join('');

        const q = dailyFilters.search.trim().toLowerCase();
        const filtered = m.enumStats.filter(e => {
          if (dailyFilters.unionId && e.unionId !== dailyFilters.unionId) return false;
          if (dailyFilters.supervisorId && e.supervisorId !== dailyFilters.supervisorId) return false;
          const effVal = Object.prototype.hasOwnProperty.call(pendingChanges, e.id) ? pendingChanges[e.id] : e.today;
          if (dailyFilters.onlyZero && effVal > 0) return false;
          if (q && !`${e.id} ${e.name} ${e.supervisorName} ${e.supervisorCode} ${e.unionName}`.toLowerCase().includes(q)) return false;
          return true;
        });

        const entryRows = filtered.length === 0
          ? `<tr><td colspan="8" class="py-10 text-center text-slate-400">নির্বাচিত ফিল্টারে কোনো তথ্য সংগ্রহকারী পাওয়া যায়নি।</td></tr>`
          : filtered.map((e, rowIdx) => {
              const isPending = Object.prototype.hasOwnProperty.call(pendingChanges, e.id);
              const val = isPending ? pendingChanges[e.id] : e.today;
              const newTot = e.prevTotal + val;
              const statusHtml = isPending
                ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-200 text-amber-950 border border-amber-400">অপেক্ষমাণ</span>`
                : (e.today > 0
                    ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-800">সংরক্ষিত</span>`
                    : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-rose-50 text-rose-600 border border-rose-200">০ এন্ট্রি</span>`);

              return `
                <tr data-daily-row="${e.id}" class="${isPending ? 'bg-amber-50/95' : 'hover:bg-slate-50/80'} transition">
                  <td class="py-2 px-3 text-center text-slate-500 font-semibold tabular-nums">${e.sl}</td>
                  <td class="py-2 px-3 font-medium text-slate-700 whitespace-nowrap">${escapeHtml(e.unionName)}</td>
                  <td class="py-2 px-3">
                    <div class="font-semibold text-slate-800">${escapeHtml(e.supervisorName)}</div>
                    <div class="text-[11px] text-slate-400 tabular-nums">${escapeHtml(e.supervisorCode)}</div>
                  </td>
                  <td class="py-2 px-3 font-semibold text-slate-900">
                    ${escapeHtml(e.name)}
                    <div class="text-[10px] text-slate-400 tabular-nums">${escapeHtml(e.id)}</div>
                  </td>
                  <td class="py-2 px-3 text-right font-semibold text-slate-600 tabular-nums">${fmtNum(e.prevTotal)}</td>
                  <td class="py-1.5 px-2.5 bg-amber-50/50 border-x border-amber-100">
                    <div class="flex items-center justify-center gap-1.5">
                      <input type="number" min="0" max="5000"
                             data-entry-input="${e.id}" data-row-idx="${rowIdx}" data-prev-total="${e.prevTotal}"
                             value="${val === 0 ? '' : val}" placeholder="0"
                             class="w-24 text-center font-bold tabular-nums text-slate-900 bg-white border ${isPending ? 'border-amber-500 ring-2 ring-amber-300/60' : 'border-amber-300'} focus:border-gov-800 focus:ring-2 focus:ring-gov-500/30 rounded-lg py-1.5 px-2 focus:outline-none transition" />
                      <button type="button" data-row-ok="${e.id}"
                              class="${isPending ? 'inline-flex' : 'hidden'} items-center gap-1 bg-gov-700 hover:bg-gov-800 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg shadow-xs transition">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i> OK
                      </button>
                    </div>
                  </td>
                  <td class="py-2 px-3 text-right font-bold text-gov-800 tabular-nums" data-total-cell="${e.id}">${fmtNum(newTot)}</td>
                  <td class="py-2 px-3 text-center" data-status-cell="${e.id}">${statusHtml}</td>
                </tr>`;
            }).join('');

        const pendingKeys = Object.keys(pendingChanges);
        const pendingSum = pendingKeys.reduce((acc, k) => acc + (parseInt(pendingChanges[k], 10) || 0), 0);

        return `
          <section class="space-y-4 pb-20">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="table-2" class="w-5 h-5 text-gov-800"></i>
                    দৈনিক ডেটা এন্ট্রি (Daily Data Entry)
                    <span class="text-[11px] font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full">অ্যাডমিন আনলকড</span>
                  </h2>
                  <p class="text-xs text-slate-500 mt-0.5">
                    সংখ্যা লিখে <kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded text-[10px]">Enter</kbd> চাপলে পরের ঘরে যাবে। স্থায়ীভাবে সংরক্ষণ করতে সারির <strong>OK</strong> অথবা নিচের <strong>OK — কনফার্ম ও সেভ করুন</strong> বাটনে ক্লিক করুন।
                  </p>
                </div>

                <div class="inline-flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200">
                  <button type="button" id="daily-prev-day" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-white text-slate-700 text-xs font-semibold"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>আগের দিন</button>
                  <input id="daily-date-input" type="date" value="${selectedDate}" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs sm:text-sm font-bold text-gov-800 tabular-nums mx-1 focus:outline-none focus:ring-2 focus:ring-gov-500" />
                  <button type="button" id="daily-today-btn" class="px-2.5 py-1.5 rounded-lg hover:bg-white text-gov-800 text-xs font-bold">আজ</button>
                  <button type="button" id="daily-next-day" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-white text-slate-700 text-xs font-semibold">পরের দিন<i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
                </div>
              </div>

              <!-- Saved Dates Log Bar -->
              <div class="bg-emerald-50/75 border border-emerald-200 rounded-xl p-3">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-bold text-gov-900 flex items-center gap-1.5">
                    <i data-lucide="history" class="w-4 h-4 text-gov-600"></i>
                    সংরক্ষিত তারিখের তালিকা (Saved Dates Log — নতুন তারিখ সিলেক্ট করলে পূর্বের ডেটা কখনোই মুছবে না)
                  </span>
                  <span class="text-[11px] font-semibold text-gov-800 tabular-nums">মোট ${m.savedDates.length} দিন সংরক্ষিত</span>
                </div>
                <div class="flex flex-wrap items-center gap-1.5">${savedChips}</div>
              </div>

              <!-- Filters -->
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-2.5 pt-1 border-t border-slate-100">
                <div class="lg:col-span-3">
                  <label class="block text-[11px] font-semibold text-slate-500 mb-1">ইউনিয়ন / পৌরসভা</label>
                  <select id="daily-f-union" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs sm:text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-gov-500">${unionOpts}</select>
                </div>
                <div class="lg:col-span-3">
                  <label class="block text-[11px] font-semibold text-slate-500 mb-1">সুপারভাইজার</label>
                  <select id="daily-f-sup" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs sm:text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-gov-500">${supOpts}</select>
                </div>
                <div class="lg:col-span-3">
                  <label class="block text-[11px] font-semibold text-slate-500 mb-1">নাম বা কোড খুঁজুন</label>
                  <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input id="daily-f-search" type="text" value="${escapeHtml(dailyFilters.search)}" placeholder="তথ্য সংগ্রহকারী / সুপারভাইজার..."
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 pl-9 pr-3 py-2 text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-gov-500" />
                  </div>
                </div>
                <div class="lg:col-span-3 flex flex-col justify-end">
                  <label class="inline-flex items-center gap-2 cursor-pointer select-none bg-rose-50 border border-rose-200 px-3 py-2 rounded-xl text-xs font-semibold text-rose-700">
                    <input id="daily-f-zero" type="checkbox" ${dailyFilters.onlyZero ? 'checked' : ''} class="rounded text-rose-600 focus:ring-rose-500 w-4 h-4" />
                    <span>শুধু ০ এন্ট্রি (Zero Entry)</span>
                  </label>
                </div>
              </div>

              <!-- Live Summary Strip -->
              <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs sm:text-sm">
                <div class="flex flex-wrap items-center gap-4">
                  <span>প্রদর্শিত: <strong class="tabular-nums text-slate-900">${fmtNum(filtered.length)}</strong> জন</span>

        const q = teamFilters.search.trim().toLowerCase();
        const filteredEnums = m.enumStats.filter(e => {
          if (teamFilters.unionId && e.unionId !== teamFilters.unionId) return false;
          if (teamFilters.supervisorId && e.supervisorId !== teamFilters.supervisorId) return false;
          if (q && !`${e.id} ${e.name} ${e.supervisorName} ${e.supervisorCode} ${e.unionName}`.toLowerCase().includes(q)) return false;

      function renderApp() {
        const app = document.getElementById('app');
        if (!app) return;

        if (PROTECTED_TABS.has(activeTab) && !isAdminUnlocked) activeTab = 'overview';

        const m = computeMetrics(selectedDate);
        let tabBody = '';
        if (activeTab === 'overview') tabBody = buildOverviewHtml(m);
        else if (activeTab === 'reports') tabBody = buildReportsHtml(m);
        else if (activeTab === 'daily') tabBody = buildDailyHtml(m);
        else if (activeTab === 'team') tabBody = buildTeamHtml(m);
        else if (activeTab === 'db') tabBody = buildDbHtml();

        app.innerHTML = `
          ${buildHeaderHtml()}
          <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5">${tabBody}</main>
          <footer class="bg-white border-t border-slate-200 py-4 mt-8 no-print">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
              <span>© ২০২৬ ফ্যামিলি কার্ড কর্মসূচি · উপজেলা প্রশাসন, কালীগঞ্জ, গাজীপুর</span>
              <span>মোট লক্ষ্য: ৯০,৬৮৫ খানা · ৮ ইউনিয়ন/পৌরসভা · ১২ সুপারভাইজার · ১২৪ তথ্য সংগ্রহকারী</span>
            </div>
          </footer>
        `;

        refreshIcons();
        updateSyncPillUI();
        bindHeaderEvents();
        if (activeTab === 'overview') bindOverviewEvents(m);
        else if (activeTab === 'reports') bindReportsEvents();
        else if (activeTab === 'daily') bindDailyEvents();
        else if (activeTab === 'team') bindTeamEvents();
        else if (activeTab === 'db') bindDbEvents();
      }

      function bindHeaderEvents() {
        document.querySelectorAll('[data-nav-tab]').forEach(btn => {
          btn.onclick = () => switchTab(btn.dataset.navTab);
        });

        const prevBtn = document.getElementById('hdr-prev-day');
        const nextBtn = document.getElementById('hdr-next-day');
        const dateInp = document.getElementById('hdr-date-input');
        if (prevBtn) prevBtn.onclick = () => requestDateChange(shiftIsoDate(selectedDate, -1));
        if (nextBtn) nextBtn.onclick = () => requestDateChange(shiftIsoDate(selectedDate, 1));
        if (dateInp) dateInp.onchange = (e) => requestDateChange(e.target.value);

        const refreshBtn = document.getElementById('hdr-refresh-btn');
        if (refreshBtn) {
          refreshBtn.onclick = async () => {
            const ic = document.getElementById('hdr-refresh-icon');
            if (ic) ic.classList.add('animate-spin');
            await pullFromFirebase(false);
            if (ic) ic.classList.remove('animate-spin');
          };
        }

        const syncPill = document.getElementById('hdr-sync-pill');
        if (syncPill) {
          syncPill.onclick = () => {
            if (isAdminUnlocked) switchTab('db');
            else if (getFirebaseEndpoint()) pullFromFirebase(false);
            else openAdminLoginModal('db');
          };
        }

        const loginBtn = document.getElementById('hdr-login-btn');
        const lockBtn = document.getElementById('hdr-lock-btn');
        if (loginBtn) loginBtn.onclick = () => openAdminLoginModal(null);
        if (lockBtn) lockBtn.onclick = lockAdminMode;
      }

      function bindOverviewEvents(m) {
        document.querySelectorAll('[data-go-tab]').forEach(b => {
          b.onclick = () => switchTab(b.dataset.goTab);
        });
        document.querySelectorAll('[data-union-jump]').forEach(tr => {
          tr.onclick = () => {
            const uId = tr.dataset.unionJump;
            if (isAdminUnlocked) {
              dailyFilters.unionId = uId;
              dailyFilters.supervisorId = '';
              dailyFilters.onlyZero = false;
              switchTab('daily');
            } else {
              switchTab('reports');
            }
          };
        });
        const zeroBtn = document.getElementById('ov-zero-btn');
        if (zeroBtn) {
          zeroBtn.onclick = () => {
            dailyFilters.unionId = '';
            dailyFilters.supervisorId = '';
            dailyFilters.onlyZero = true;
            switchTab('daily');
          };
        }
        const pctBtn = document.getElementById('chart-btn-pct');
        const hhBtn = document.getElementById('chart-btn-hh');
        if (pctBtn) pctBtn.onclick = () => { unionChartMode = 'pct'; renderApp(); };
        if (hhBtn) hhBtn.onclick = () => { unionChartMode = 'hh'; renderApp(); };

        renderOverviewCharts(m);
      }

      function renderOverviewCharts(m) {
        if (typeof Chart === 'undefined') return;
        const uCanvas = document.getElementById('unionChartCanvas');
        const tCanvas = document.getElementById('trendChartCanvas');
        if (!uCanvas || !tCanvas) return;

        if (unionChartInst) { unionChartInst.destroy(); unionChartInst = null; }
        if (trendChartInst) { trendChartInst.destroy(); trendChartInst = null; }

        const isPct = unionChartMode === 'pct';
        unionChartInst = new Chart(uCanvas, {
          type: 'bar',
          data: isPct ? {
            labels: m.unionStats.map(u => u.name),
            datasets: [{
              label: 'অগ্রগতির হার (%)',
              data: m.unionStats.map(u => Number(u.progressPct.toFixed(2))),
              backgroundColor: m.unionStats.map(u => u.progressPct >= 100 ? '#065f46' : u.progressPct >= 40 ? '#10b981' : u.progressPct >= 1 ? '#f59e0b' : '#cbd5e1'),
              borderRadius: 6,
              maxBarThickness: 36
            }]
          } : {
            labels: m.unionStats.map(u => u.name),
            datasets: [
              { label: 'সংগৃহীত খানা', data: m.unionStats.map(u => u.total), backgroundColor: '#065f46', borderRadius: 4 },
              { label: 'বাকি খানা', data: m.unionStats.map(u => u.remaining), backgroundColor: '#e2e8f0', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: !isPct, position: 'bottom', labels: { font: { family: 'Noto Sans Bengali' } } },
              tooltip: { callbacks: { label: ctx => isPct ? ` অগ্রগতি: ${ctx.parsed.y}%` : ` ${ctx.dataset.label}: ${fmtNum(ctx.parsed.y)}` } }
            },
            scales: {
              x: { stacked: !isPct, grid: { display: false }, ticks: { font: { size: 11, family: 'Noto Sans Bengali' } } },
              y: { stacked: !isPct, beginAtZero: true, max: isPct ? 100 : undefined, ticks: { callback: v => isPct ? v + '%' : fmtNum(v) } }
            }
          }
        });

        const saved = m.savedDates;
        const labels = saved.length > 0 ? saved.map(d => d.date.slice(5)) : [selectedDate.slice(5)];
        const dailyVals = saved.length > 0 ? saved.map(d => d.total) : [0];
        let cum = 0;
        const cumVals = dailyVals.map(v => (cum += v));

        trendChartInst = new Chart(tCanvas, {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'দৈনিক এন্ট্রি',
                data: dailyVals,
                borderColor: '#0284c7',
                backgroundColor: 'rgba(2, 132, 199, 0.14)',
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointBackgroundColor: '#0284c7',
                yAxisID: 'y'
              },
              {
                label: 'ক্রমবর্ধমান মোট',
                data: cumVals,
                borderColor: '#065f46',
                backgroundColor: 'transparent',
                borderDash: [5, 4],
                tension: 0.25,
                pointRadius: 3,
                pointBackgroundColor: '#065f46',
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { position: 'bottom', labels: { font: { family: 'Noto Sans Bengali' } } } },
            scales: {
              x: { grid: { display: false } },
              y: { type: 'linear', position: 'left', beginAtZero: true, title: { display: true, text: 'দৈনিক' } },
              y1: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: 'ক্রমবর্ধমান মোট' } }
            }
          }
        });
      }

      function bindReportsEvents() {
        const dInp = document.getElementById('rep-date-input');
        if (dInp) dInp.onchange = (e) => requestDateChange(e.target.value);
        const exBtn = document.getElementById('rep-excel-btn');
        if (exBtn) exBtn.onclick = exportExcelWorkbook;
        const prBtn = document.getElementById('rep-print-btn');
        if (prBtn) prBtn.onclick = () => {
          state.supervisors.forEach(s => expandedReportGroups.add(s.id));
          renderApp();
          setTimeout(() => window.print(), 180);
        };
        const expAll = document.getElementById('rep-expand-all');
        const colAll = document.getElementById('rep-collapse-all');
        if (expAll) expAll.onclick = () => { state.supervisors.forEach(s => expandedReportGroups.add(s.id)); renderApp(); };
        if (colAll) colAll.onclick = () => { expandedReportGroups.clear(); renderApp(); };

        document.querySelectorAll('[data-toggle-group]').forEach(tr => {
          tr.onclick = () => {
            const id = tr.dataset.toggleGroup;
            if (expandedReportGroups.has(id)) expandedReportGroups.delete(id);
            else expandedReportGroups.add(id);
            renderApp();
          };
        });
      }

      function bindDailyEvents() {
        const prevBtn = document.getElementById('daily-prev-day');
        const nextBtn = document.getElementById('daily-next-day');
        const todayBtn = document.getElementById('daily-today-btn');
        const dateInp = document.getElementById('daily-date-input');
        if (prevBtn) prevBtn.onclick = () => requestDateChange(shiftIsoDate(selectedDate, -1));
        if (nextBtn) nextBtn.onclick = () => requestDateChange(shiftIsoDate(selectedDate, 1));
        if (todayBtn) todayBtn.onclick = () => requestDateChange(getTodayISO());
        if (dateInp) dateInp.onchange = (e) => requestDateChange(e.target.value);

        document.querySelectorAll('[data-saved-date]').forEach(btn => {
          btn.onclick = () => requestDateChange(btn.dataset.savedDate);
        });

        const fUnion = document.getElementById('daily-f-union');
        const fSup = document.getElementById('daily-f-sup');
        const fZero = document.getElementById('daily-f-zero');
        const fSearch = document.getElementById('daily-f-search');
        if (fUnion) fUnion.onchange = (e) => { dailyFilters.unionId = e.target.value; dailyFilters.supervisorId = ''; renderApp(); };
        if (fSup) fSup.onchange = (e) => { dailyFilters.supervisorId = e.target.value; renderApp(); };
        if (fZero) fZero.onchange = (e) => { dailyFilters.onlyZero = e.target.checked; renderApp(); };
        if (fSearch) {
          fSearch.oninput = (e) => {
            const pos = e.target.selectionStart;
            dailyFilters.search = e.target.value;
            renderApp();
            const ns = document.getElementById('daily-f-search');
            if (ns) { ns.focus(); ns.setSelectionRange(pos, pos); }
          };
        }

        const clearDateBtn = document.getElementById('daily-clear-date-btn');
        if (clearDateBtn) {
          clearDateBtn.onclick = () => {
            openConfirmModal(
              'শুধু এই তারিখের এন্ট্রি মুছবেন?',
              `${selectedDate} তারিখের সকল এন্ট্রি ০ করা হবে। অন্যান্য সকল তারিখের ডেটা সম্পূর্ণ নিরাপদ থাকবে।`,
              async () => {
                delete state.entriesByDate[selectedDate];
                pendingChanges = {};
                await commitStateAndSync(`${selectedDate} তারিখের এন্ট্রি মুছে ফেলা হয়েছে`);
              },
              'OK — মুছে ফেলুন',
              true
            );
          };
        }

        // Fast keyboard-friendly inline entry updates without full DOM rebuild
        document.querySelectorAll('[data-entry-input]').forEach(inp => {
          inp.addEventListener('input', () => {
            const enumId = inp.dataset.entryInput;
            const parsed = Math.max(0, parseInt(inp.value, 10) || 0);
            const committed = getCommittedEntry(enumId, selectedDate);
            const isMod = parsed !== committed;
            if (isMod) pendingChanges[enumId] = parsed;
            else delete pendingChanges[enumId];

            const row = document.querySelector(`[data-daily-row="${enumId}"]`);
            const okBtn = document.querySelector(`[data-row-ok="${enumId}"]`);
            const totCell = document.querySelector(`[data-total-cell="${enumId}"]`);
            const stCell = document.querySelector(`[data-status-cell="${enumId}"]`);

            if (row) row.classList.toggle('bg-amber-50/95', isMod);
            inp.classList.toggle('border-amber-500', isMod);
            inp.classList.toggle('ring-2', isMod);
            inp.classList.toggle('ring-amber-300/60', isMod);
            if (okBtn) {
              okBtn.classList.toggle('hidden', !isMod);
              okBtn.classList.toggle('inline-flex', isMod);
            }
            if (totCell) totCell.textContent = fmtNum((parseInt(inp.dataset.prevTotal, 10) || 0) + parsed);
            if (stCell) {
              stCell.innerHTML = isMod
                ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-200 text-amber-950 border border-amber-400">অপেক্ষমাণ</span>`
                : (committed > 0
                    ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-800">সংরক্ষিত</span>`
                    : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-rose-50 text-rose-600 border border-rose-200">০ এন্ট্রি</span>`);
            }

            // Update sticky confirmation bar live
            const keys = Object.keys(pendingChanges);
            const sum = keys.reduce((a, k) => a + (parseInt(pendingChanges[k], 10) || 0), 0);
            const bar = document.getElementById('pending-sticky-bar');
            const barTxt = document.getElementById('pending-bar-text');
            if (bar) {
              bar.classList.toggle('hidden', keys.length === 0);
              bar.classList.toggle('flex', keys.length > 0);
            }
            if (barTxt) barTxt.textContent = `${keys.length} টি সারি অসংরক্ষিত · মোট ${fmtNum(sum)} এন্ট্রি (${selectedDate})`;
          });

          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              const nextIdx = (parseInt(inp.dataset.rowIdx, 10) || 0) + 1;
              const nextInp = document.querySelector(`[data-row-idx="${nextIdx}"]`);
              if (nextInp) {
                nextInp.focus();
                nextInp.select();
              } else if (Object.keys(pendingChanges).length > 0) {
                openDailyConfirmModal();
              }
            }
          });
        });

        document.querySelectorAll('[data-row-ok]').forEach(btn => {
          btn.onclick = () => openDailyConfirmModal(btn.dataset.rowOk);
        });

        const discBtn = document.getElementById('pending-discard-btn');
        const okBtn = document.getElementById('pending-ok-btn');
        if (discBtn) discBtn.onclick = () => { pendingChanges = {}; renderApp(); showToast('অসংরক্ষিত পরিবর্তন বাতিল করা হয়েছে।', 'info'); };
        if (okBtn) okBtn.onclick = () => openDailyConfirmModal();
      }

        const fSearch = document.getElementById('team-f-search');
        if (fUnion) fUnion.onchange = (e) => { teamFilters.unionId = e.target.value; teamFilters.supervisorId = ''; renderApp(); };
        if (fSup) fSup.onchange = (e) => { teamFilters.supervisorId = e.target.value; renderApp(); };
        if (fSearch) {
          fSearch.oninput = (e) => {
            const pos = e.target.selectionStart;
            teamFilters.search = e.target.value;
            renderApp();
            const ns = document.getElementById('team-f-search');
            if (ns) { ns.focus(); ns.setSelectionRange(pos, pos); }
          };
        }

        document.querySelectorAll('[data-save-sup]').forEach(btn => {
          btn.onclick = () => {
            const supId = btn.dataset.saveSup;
            const row = document.querySelector(`[data-sup-row="${supId}"]`);
            const sup = state.supervisors.find(s => s.id === supId);
            if (!row || !sup) return;
            const code = row.querySelector('[data-sf="code"]').value.trim();
            const name = row.querySelector('[data-sf="name"]').value.trim();
            const unionId = row.querySelector('[data-sf="unionId"]').value;
            const targetHH = Math.max(0, parseInt(row.querySelector('[data-sf="targetHH"]').value, 10) || 0);
            if (!code || !name) { showToast('কোড এবং নাম খালি রাখা যাবে না।', 'error'); return; }
            const uObj = state.unions.find(u => u.id === unionId);
            openConfirmModal(
              'সুপারভাইজার আপডেট কনফার্ম করুন',
              `কোড: ${code} | নাম: ${name} | ইউনিয়ন: ${uObj?.name || ''} | টার্গেট: ${fmtNum(targetHH)} — সেভ করতে OK ক্লিক করুন।`,
              async () => {
                sup.code = code;
                sup.name = name;
                sup.unionId = unionId;
                sup.targetHH = targetHH;
                await commitStateAndSync(`সুপারভাইজার "${name}" আপডেট হয়েছে`);
              }
            );
          };
        });

        document.querySelectorAll('[data-del-sup]').forEach(btn => {
          btn.onclick = () => {
            const supId = btn.dataset.delSup;
            const sup = state.supervisors.find(s => s.id === supId);
            if (!sup) return;
            const cnt = state.enumerators.filter(e => e.supervisorId === supId).length;
            if (cnt > 0) {
              showToast(`এই সুপারভাইজারের অধীনে ${cnt} জন তথ্য সংগ্রহকারী রয়েছে। আগে তাদের অন্য সুপারভাইজারে অ্যাসাইন করুন।`, 'error');
              return;
            }
            openConfirmModal(
              'সুপারভাইজার মুছবেন?',
              `"${sup.name}" (${sup.code}) কে তালিকা থেকে স্থায়ীভাবে মুছে ফেলতে চান?`,
              async () => {
                state.supervisors = state.supervisors.filter(s => s.id !== supId);
                await commitStateAndSync('সুপারভাইজার মুছে ফেলা হয়েছে');
              },
              'OK — মুছুন',
              true
            );
          };
        });

        document.querySelectorAll('[data-save-enum]').forEach(btn => {
          btn.onclick = () => {
            const enumId = btn.dataset.saveEnum;
            const row = document.querySelector(`[data-enum-row="${enumId}"]`);
            const en = state.enumerators.find(e => e.id === enumId);
            if (!row || !en) return;
            const name = row.querySelector('[data-ef="name"]').value.trim();
            const supervisorId = row.querySelector('[data-ef="supervisorId"]').value;
            if (!name) { showToast('তথ্য সংগ্রহকারীর নাম খালি রাখা যাবে না।', 'error'); return; }
            const sup = state.supervisors.find(s => s.id === supervisorId);
            openConfirmModal(
              'তথ্য সংগ্রহকারী আপডেট কনফার্ম করুন',
              `নাম: ${name} | সুপারভাইজার: ${sup?.name || ''} (${sup?.code || ''}) — সেভ করতে OK ক্লিক করুন।`,
              async () => {
                en.name = name;
                en.supervisorId = supervisorId;
                await commitStateAndSync(`"${name}" আপডেট ও অ্যাসাইনমেন্ট সেভ হয়েছে`);
              }
            );
          };
        });

        document.querySelectorAll('[data-del-enum]').forEach(btn => {
          btn.onclick = () => {
            const enumId = btn.dataset.delEnum;
            const en = state.enumerators.find(e => e.id === enumId);
            if (!en) return;
            const tot = getEnumTotalEntry(enumId);
            openConfirmModal(
              'তথ্য সংগ্রহকারী মুছবেন?',
              `"${en.name}" (${en.id}) কে মুছে ফেলতে চান? (তার মোট এন্ট্রি: ${fmtNum(tot)} টি)`,
              async () => {
                state.enumerators = state.enumerators.filter(e => e.id !== enumId);
                for (const d of Object.keys(state.entriesByDate)) {
                  if (state.entriesByDate[d]) delete state.entriesByDate[d][enumId];
                }
                delete pendingChanges[enumId];
                await commitStateAndSync('তথ্য সংগ্রহকারী মুছে ফেলা হয়েছে');
              },
              'OK — মুছুন',
              true
            );
          };
        });
      }

      function bindDbEvents() {
        const connectBtn = document.getElementById('db-fb-connect-btn');
        const pullBtn = document.getElementById('db-pull-btn');
        const pushBtn = document.getElementById('db-push-btn');
        const exportGhBtn = document.getElementById('db-export-gh-btn');
        const copyRulesBtn = document.getElementById('db-copy-rules-btn');
        const exportExBtn = document.getElementById('db-excel-export-btn');
        const importExInp = document.getElementById('db-excel-import-input');

        const showTestFeedback = (msg, isOk) => {
          const box = document.getElementById('db-test-feedback');
          if (!box) return;
          box.className = `rounded-xl px-4 py-3 text-xs sm:text-sm font-semibold border ${isOk ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`;
          box.textContent = msg;
        };

        if (connectBtn) {
          connectBtn.onclick = async () => {
            const rawUrl = document.getElementById('db-fb-url-input')?.value || '';
            const clean = cleanFirebaseUrl(rawUrl);
            if (!clean || !/^https:\/\/.+/i.test(clean)) {
              showTestFeedback('সঠিক Firebase Realtime Database URL দিন (https:// দিয়ে শুরু হবে)।', false);
              return;
            }
            const ep = `${clean}/kaliganj_fc_tracker.json`;
            showTestFeedback('কানেকশন যাচাই (GET ও PUT টেস্ট) চলছে...', true);
            try {
              // 1. Test GET
              const getRes = await fetch(ep, { method: 'GET', cache: 'no-store' });
              if (!getRes.ok) {
                throw new Error(`GET ব্যর্থ (HTTP ${getRes.status}) — Firebase Rules-এ ".read": true সেট করে Publish করুন।`);
              }
              const existingRemote = await getRes.json();

              // Save URL to localStorage
              safeSetLS(LS_FB_URL_KEY, clean);

              // 2. If remote already has valid data, load it; otherwise test PUT by uploading current state
              if (existingRemote && typeof existingRemote === 'object' && Array.isArray(existingRemote.enumerators)) {
                state = normalizeState(existingRemote);
                saveLocalCache();
                // Verify write permission with PUT
                const putRes = await fetch(ep, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ ...state, clientSyncId: SESSION_CLIENT_ID })
                });
                if (!putRes.ok) {
                  throw new Error(`READ সফল কিন্তু WRITE ব্লক (HTTP ${putRes.status}) — Firebase Rules-এ ".write": true দিন।`);
                }
                setSyncStatus('live', 'রিয়েল-টাইম সংযুক্ত');
                startRealtimeFirebaseStream();
                renderApp();
                showToast('সফলভাবে Firebase সংযুক্ত হয়েছে এবং অনলাইনের সর্বশেষ ডেটা লোড হয়েছে!', 'success');
              } else {
                // Remote is empty -> test PUT by seeding initial state
                state.updatedAt = new Date().toISOString();
                state.updatedBy = 'Admin';
                const putRes = await fetch(ep, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ ...state, clientSyncId: SESSION_CLIENT_ID })
                });
                if (!putRes.ok) {
                  throw new Error(`WRITE ব্যর্থ (HTTP ${putRes.status}) — Firebase Rules-এ ".write": true করে Publish করুন।`);
                }
                saveLocalCache();
                setSyncStatus('live', 'রিয়েল-টাইম সংযুক্ত');
                startRealtimeFirebaseStream();
                renderApp();
                showToast('Firebase সংযুক্ত ও ডেটা পুশ সফল! এখন "GitHub-এর জন্য রেডি index.html ডাউনলোড করুন" ক্লিক করুন।', 'success');
              }
            } catch (err) {
              setSyncStatus('error', err.message);
              showTestFeedback(`ত্রুটি: ${err.message}`, false);
              showToast(err.message, 'error');
            }
          };
        }

        if (pullBtn) {
          pullBtn.onclick = async () => {
            await pullFromFirebase(false);
          };
        }

        if (pushBtn) {
          pushBtn.onclick = () => {
            if (!getFirebaseEndpoint()) {
              showToast('প্রথমে Firebase URL দিয়ে কানেকশন টেস্ট ও সংযুক্ত করুন।', 'error');
              return;
            }
            openConfirmModal(
              'লোকাল ডেটা অনলাইনে পুশ করবেন?',
              'বর্তমানে আপনার ব্রাউজারে থাকা সকল ডেটা Firebase Realtime Database-এ আপডেট হবে এবং সকল ভিজিটর এটি দেখতে পারবেন।',
              async () => {
                state.updatedAt = new Date().toISOString();
                state.updatedBy = 'Admin';
                saveLocalCache();
                const ok = await pushToFirebase(false);
                if (ok) {
                  renderApp();
                  showToast('সকল ডেটা Firebase অনলাইন ডেটাবেসে সফলভাবে পুশ হয়েছে!', 'success');
                }
              }
            );
          };
        }

        if (exportGhBtn) exportGhBtn.onclick = downloadGitHubReadyHtml;
        if (copyRulesBtn) copyRulesBtn.onclick = () => copyToClipboard(FIREBASE_RULES_JSON, 'Firebase Security Rules কপি করা হয়েছে!');
        if (exportExBtn) exportExBtn.onclick = exportExcelWorkbook;

        if (importExInp) {
          importExInp.onchange = (e) => {
            const file = e.target.files?.[0];
            e.target.value = '';
            if (file) handleExcelImportFile(file);
          };
        }
      }

      // =======================================================================
      // 13. INITIALIZATION ON PAGE LOAD
      // =======================================================================
      window.addEventListener('DOMContentLoaded', () => {
        loadLocalCache();
        renderApp();
        bootRealtimeSync();
      });

      window.addEventListener('beforeunload', () => {
        stopRealtimeListeners();
      });
    })();
  </script>
